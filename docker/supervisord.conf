[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:apache]
command=apache2-foreground
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Der langlaufende Prozess fuer die Live-Verbindung. Laeuft als www-data,
; damit Uploads und Datenbanken demselben Benutzer gehoeren wie bei Apache.
[program:websocket]
command=php /var/www/html/ws/server.php start
user=www-data
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
