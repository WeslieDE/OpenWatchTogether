[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:apache]
command=apache2-foreground
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Der langlaufende Prozess fuer die Live-Verbindung. Laeuft als www-data,
; damit Uploads und Datenbanken demselben Benutzer gehoeren wie bei Apache.
[program:websocket]
command=php /var/www/html/ws/server.php start
user=www-data
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Der SFU-Prozess fuer die Bildschirmuebertragung (WebRTC/mediasoup). Kennt
; keine eigene Ablage, braucht also keinen bestimmten Benutzer - laeuft aber
; ebenfalls als www-data, damit nichts mit erhoehten Rechten laeuft.
[program:sfu]
command=node /var/www/html/sfu/server.js
directory=/var/www/html/sfu
user=www-data
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; HLSStream: klinkt sich pro Raum mit HLS-Zuschauern wie ein normaler
; Browser-Client in ws/server.php (und bei laufender Bildschirmuebertragung
; zusaetzlich in sfu/server.js) ein und schreibt fortlaufend HLS-Segmente
; nach HLSStream/data - siehe docs/hlsstream.md. Eigenstaendiges, vorab
; kompiliertes Go-Binary (siehe Dockerfile), laeuft als www-data wie die
; anderen beiden Prozesse.
[program:hlsstream]
command=/usr/local/bin/hlsstream
user=www-data
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
