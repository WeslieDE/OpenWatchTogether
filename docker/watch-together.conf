# Die Live-Verbindung haengt hinter demselben Webserver wie die Seite. So
# reicht ein einziger Port nach aussen, und hinter HTTPS wird daraus von
# allein wss.
ProxyRequests Off
ProxyPass        /ws ws://127.0.0.1:8081/ upgrade=websocket
ProxyPassReverse /ws ws://127.0.0.1:8081/

# Signalisierung der Bildschirmuebertragung (SFU/mediasoup), genauso
# durchgereicht. Die eigentlichen Mediendaten laufen daran vorbei direkt zum
# SFU-Prozess - das ist der einzige zusaetzlich offene Port.
ProxyPass        /sfu-ws ws://127.0.0.1:8082/ upgrade=websocket
ProxyPassReverse /sfu-ws ws://127.0.0.1:8082/

# HLSStream (siehe docs/hlsstream.md): die Playlist /stream/<raum>.m3u8 wird
# von diesem Prozess selbst erzeugt (er muss wissen, wann ein Zuschauer
# zusieht, um den Raum zu betreten/verlassen) und deshalb durchgereicht - der
# nachfolgende Trailing Slash sorgt dafuer, dass ausschliesslich /stream/...
# gemeint ist, nicht /stream-seg/... darunter. Die eigentlichen .ts-Segmente
# dagegen liefert Apache direkt aus dem Dateisystem, wie schon bei /media.
ProxyPass        /stream/ http://127.0.0.1:8083/stream/
ProxyPassReverse /stream/ http://127.0.0.1:8083/stream/

# Grosse Videos gehen in Stuecken hoch, aber sie kommen am Stueck wieder
# heraus. Apache soll dabei nicht dazwischenfunken.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    EnableSendfile On
</Directory>

# Die Videos selbst liefert Apache direkt aus dem Datenordner aus, ohne
# Umweg ueber PHP - das spart Leistung beim Abspielen und Spulen. WT_DATA_DIR
# ist im Image fest auf /data gesetzt, siehe Dockerfile.
#
# Freigegeben sind nur Video-Endungen. Alles andere im selben Ordner (die
# Datenbank je Raum, angefangene Uploads) bleibt gesperrt.
Alias /media /data/media
<Directory /data/media>
    Options -Indexes -MultiViews +FollowSymLinks
    EnableSendfile On
    # Ein einzelner Require-Ausdruck statt verschachteltem FilesMatch, weil
    # sich Require-Regeln aus <Directory> und einem darin verschachtelten
    # <FilesMatch> nicht zuverlaessig gegenseitig ausser Kraft setzen.
    Require expr "%{REQUEST_URI} =~ /(?i)\.(mp4|m4v|webm|ogv|ogg|mov)$/"
</Directory>

# Die HLS-Segmente von HLSStream, genauso direkt ausgeliefert statt ueber den
# Go-Prozess - der schreibt sie fortlaufend nach HLSStream/data/<raum>/, die
# Playlist verweist per "-hls_base_url" darauf (siehe internal/pipeline).
Alias /stream-seg /var/www/html/HLSStream/data
<Directory /var/www/html/HLSStream/data>
    Options -Indexes -MultiViews +FollowSymLinks
    EnableSendfile On
    Require expr "%{REQUEST_URI} =~ /(?i)\.ts$/"
</Directory>
