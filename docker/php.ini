; Videos gehen in Stuecken hoch. Ein Stueck ist klein, deshalb reichen hier
; bescheidene Werte, ganz gleich wie gross die Datei insgesamt ist. Eine
; Obergrenze je Datei gibt es nicht.
post_max_size = 16M
upload_max_filesize = 16M
memory_limit = 256M

; Das Ausliefern eines langen Videos darf dauern.
max_execution_time = 0
max_input_time = 0

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
